name: Quality Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Parse JSON configuration and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
                  print("JSON OK:", path)
          PY
      - name: Validate canonical five-stage / 21-node taxonomy
        run: python scripts/validate_taxonomy.py
      - name: Validate tests and resource-card schema
        run: python -m unittest discover -s tests -v
