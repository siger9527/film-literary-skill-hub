version: 1
# GitHub repository search queries. Keep these focused; broad searches create noise.
queries:
  - '"SKILL.md" filmmaking OR film OR cinema'
  - '"SKILL.md" screenwriting OR screenplay OR scriptwriting'
  - '"SKILL.md" animation OR storyboard OR cinematography'
  - '"SKILL.md" video editing OR post-production OR sound design'
  - '"SKILL.md" literature OR fiction writing OR storytelling'
seed_repositories:
  - calesthio/OpenMontage
  - kajisho5/ffmpeg-skill
  - ai-film-skills/ai-film-skills
max_repositories_per_query: 15
max_skill_files_per_repository: 30
